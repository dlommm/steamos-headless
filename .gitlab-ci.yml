# Builds both images and pushes them to this project's container registry:
#   $CI_REGISTRY_IMAGE:amd     $CI_REGISTRY_IMAGE:nvidia
# plus a dated tag per build (e.g. amd-20260927) to roll back to.
#
# To track new SteamOS/Sunshine releases automatically, add a pipeline
# schedule (Build > Pipeline schedules), e.g. weekly. Builds never use the
# layer cache, so "latest" is re-resolved every run.
#
# Needs a runner that allows privileged Docker-in-Docker.

stages: [build]

.build:
  stage: build
  # win-runner also picks up untagged jobs; keep builds on the Linux runner.
  tags: [Linux]
  image: docker:28
  services:
    - name: docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    STEAMOS_VERSION: latest
    SUNSHINE_VERSION: latest
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      docker build --pull --no-cache --target "$TARGET" \
        --build-arg STEAMOS_VERSION="$STEAMOS_VERSION" \
        --build-arg SUNSHINE_VERSION="$SUNSHINE_VERSION" \
        -t "$CI_REGISTRY_IMAGE:$TARGET" .
    - docker run --rm --entrypoint cat "$CI_REGISTRY_IMAGE:$TARGET" /etc/steamos-docker-release
    - docker tag "$CI_REGISTRY_IMAGE:$TARGET" "$CI_REGISTRY_IMAGE:$TARGET-$(date +%Y%m%d)"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker push "$CI_REGISTRY_IMAGE:$TARGET"
        docker push "$CI_REGISTRY_IMAGE:$TARGET-$(date +%Y%m%d)"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH
      changes: [Dockerfile, rootfs/**/*, .gitlab-ci.yml]

build-amd:
  extends: .build
  variables:
    TARGET: amd

build-nvidia:
  extends: .build
  variables:
    TARGET: nvidia
