# Builds the single SteamOS image (AMD + NVIDIA) and, on the default branch:
#   - pushes $CI_REGISTRY_IMAGE:latest
#            $CI_REGISTRY_IMAGE:<version>        e.g. 2026.09.28.3 (date.pipeline)
#            $CI_REGISTRY_IMAGE:steamos-<x.y>    newest build for that SteamOS release
#   Other branches push only $CI_REGISTRY_IMAGE:branch-<name>, for testing.
#   - creates a GitLab Release <version> listing the SteamOS/Sunshine/Steam/
#     gamescope/Mesa versions inside the image
#
# Add a pipeline schedule (Build > Pipeline schedules), e.g. weekly, to pick up
# new SteamOS and Sunshine releases automatically. Builds never use the layer
# cache, so "latest" is re-resolved every run.

stages: [build, release]

workflow:
  rules:
    # Releases create tags; don't start another pipeline for those.
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH

default:
  # win-runner also picks up untagged jobs; keep everything on the Linux runner.
  tags: [Linux]

build:
  stage: build
  image: docker:28
  services:
    - name: docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    STEAMOS_VERSION: latest
    SUNSHINE_VERSION: latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
    - changes: [Dockerfile, rootfs/**/*, .gitlab-ci.yml]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - VERSION="$(date -u +%Y.%m.%d).${CI_PIPELINE_IID}"
    - |
      docker build --pull --no-cache \
        --build-arg STEAMOS_VERSION="$STEAMOS_VERSION" \
        --build-arg SUNSHINE_VERSION="$SUNSHINE_VERSION" \
        --build-arg IMAGE_VERSION="$VERSION" \
        -t "$CI_REGISTRY_IMAGE:$VERSION" .
    - docker run --rm --entrypoint cat "$CI_REGISTRY_IMAGE:$VERSION" /etc/steamos-docker-release | tee release.txt
    # Component versions → REL_* variables for the release job.
    - sed -E 's/^([A-Z_]+)=/REL_\1=/' release.txt | grep -vE '^REL_(SUNSHINE_URL|IMAGE_VERSION)=' > build.env
    - echo "VERSION=$VERSION" >> build.env
    - . ./build.env
    - |
      cat > release-notes.md <<EOF
      \`\`\`
      docker pull $CI_REGISTRY_IMAGE:$VERSION
      \`\`\`

      One image for AMD and NVIDIA GPUs. The GPU is detected at start.

      | Component | Version |
      |---|---|
      | SteamOS package repos | $REL_STEAMOS_VERSION |
      | Steam client (steam-jupiter-stable) | $REL_STEAM_JUPITER_STABLE |
      | gamescope | $REL_GAMESCOPE |
      | Mesa (Valve build) | $REL_MESA |
      | RADV (vulkan-radeon) | $REL_VULKAN_RADEON |
      | Sunshine | $REL_SUNSHINE_VERSION |

      Also tagged \`latest\` and \`steamos-$REL_STEAMOS_VERSION\`. Built from $CI_COMMIT_SHORT_SHA by pipeline $CI_PIPELINE_URL.
      EOF
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        for tag in "$VERSION" latest "steamos-$REL_STEAMOS_VERSION"; do
          docker tag "$CI_REGISTRY_IMAGE:$VERSION" "$CI_REGISTRY_IMAGE:$tag"
          docker push "$CI_REGISTRY_IMAGE:$tag"
        done
      else
        # Test builds: only a branch-<name> tag, never latest or a release.
        docker tag "$CI_REGISTRY_IMAGE:$VERSION" "$CI_REGISTRY_IMAGE:branch-$CI_COMMIT_REF_SLUG"
        docker push "$CI_REGISTRY_IMAGE:branch-$CI_COMMIT_REF_SLUG"
      fi
  artifacts:
    paths: [release.txt, release-notes.md]
    reports:
      dotenv: build.env

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs: [build]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [Dockerfile, rootfs/**/*, .gitlab-ci.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")
  script:
    - echo "Releasing $VERSION (SteamOS $REL_STEAMOS_VERSION, Sunshine $REL_SUNSHINE_VERSION)"
  release:
    tag_name: $VERSION
    ref: $CI_COMMIT_SHA
    name: "$VERSION: SteamOS $REL_STEAMOS_VERSION, Sunshine $REL_SUNSHINE_VERSION"
    description: release-notes.md
    assets:
      links:
        - name: "Container image $CI_REGISTRY_IMAGE:$VERSION"
          url: "https://$CI_SERVER_HOST/$CI_PROJECT_PATH/container_registry"
          link_type: image
