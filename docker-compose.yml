# One image for AMD and NVIDIA: the GPU is detected at start, and on NVIDIA
# the driver matching the host is loaded automatically.
#
#   docker compose pull && docker compose up -d     # prebuilt image from GitLab
#   docker compose up -d --build                    # or build locally

services:
  steamos:
    image: ${IMAGE_REPO:-registry.ohhcloud.com/dlomm/arch-steam-headless}:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        STEAMOS_VERSION: ${STEAMOS_VERSION:-latest}
        SUNSHINE_VERSION: ${SUNSHINE_VERSION:-latest}
    container_name: steamos
    # No `hostname:`. Under host networking the container keeps the host's
    # hostname, which Moonlight discovery (mDNS) relies on.
    restart: unless-stopped
    # Host networking: Moonlight discovery (mDNS) and Sunshine's port range just work.
    network_mode: host
    # Needed for input (uinput/libinput via seatd), GPU access, and Steam's
    # bubblewrap sandbox (pressure-vessel). See README "Security".
    privileged: true
    # No CPU/RAM limits: the container uses every core and all memory the host
    # has. Host IPC gives /dev/shm (used by Proton/games) the host's full size
    # instead of Docker's 64 MB default.
    ipc: host
    ulimits:
      nofile: { soft: 524288, hard: 524288 }
      memlock: { soft: -1, hard: -1 }
    environment:
      # auto (default), nvidia or amd. Only needed on hosts with both GPUs.
      GPU_VENDOR: ${GPU_VENDOR:-auto}
      # Multi-GPU hosts: use only this card, by PCI address from the log's
      # "GPUs found" table (e.g. 0000:c1:00.0). Empty = pick automatically.
      GPU: ${GPU:-}
      # Optional: allow SSH into the container as deck on port 2222 (key only).
      SSH_AUTHORIZED_KEYS: ${SSH_AUTHORIZED_KEYS:-}
      STEAMOS_RESOLUTION: ${STEAMOS_RESOLUTION:-1920x1080}
      STEAMOS_REFRESH: ${STEAMOS_REFRESH:-60}
      SUNSHINE_USER: ${SUNSHINE_USER:-admin}
      SUNSHINE_PASS: ${SUNSHINE_PASS:-}
      TZ: ${TZ:-UTC}
      STEAM_LIBRARIES: ${STEAM_LIBRARIES:-/games}
      # Optional Deck add-ons; every option is in the README ("Add-ons").
      # e.g. decky,heroic,protonup,xcloud
      PRELOAD_APPS: ${PRELOAD_APPS:-}
      # Other Flathub apps by app ID, e.g. com.spotify.Client
      PRELOAD_FLATPAKS: ${PRELOAD_FLATPAKS:-}
      # Decky store plugins by name, e.g. CSS Loader,SteamGridDB
      DECKY_PLUGINS: ${DECKY_PLUGINS:-}
      # Which installed apps to add to Steam: empty = the game launchers, none, or names/IDs
      ADD_TO_STEAM: ${ADD_TO_STEAM:-}
    volumes:
      # Sunshine's virtual controllers/keyboard/mouse are created on the host
      # kernel, so the container needs the host's input nodes and udev database.
      - /dev/input:/dev/input
      - /run/udev:/run/udev:ro
      # Steam library, Steam login, Sunshine config and pairings.
      - steamos-home:/home/deck
      # Optional: game library on a separate (e.g. HDD) drive. It's added to
      # Steam automatically (Settings > Storage). More drives: mount them too
      # and list them in STEAM_LIBRARIES, e.g. /games:/games2.
      # - /mnt/hdd/games:/games
      # Cached NVIDIA driver installers (unused on AMD).
      - nvidia-cache:/var/cache/nvidia

volumes:
  steamos-home:
  nvidia-cache:
