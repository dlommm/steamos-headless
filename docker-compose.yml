# Pick the one matching your GPU. Either use the images GitLab CI builds
# (set IMAGE_REPO in .env, then `docker compose --profile amd pull`), or build locally:
#   docker compose --profile amd up -d --build
#   docker compose --profile nvidia up -d --build
#
# Update SteamOS + Sunshine to the newest releases:
#   docker compose --profile amd build --pull --no-cache && docker compose --profile amd up -d

x-steamos: &steamos
  restart: unless-stopped
  # Host networking: Moonlight discovery (mDNS) and Sunshine's port range just work.
  network_mode: host
  # Needed for input (uinput/libinput via seatd), GPU access, and Steam's
  # bubblewrap sandbox (pressure-vessel). See README "Security".
  privileged: true
  shm_size: 2gb
  ulimits:
    nofile: { soft: 524288, hard: 524288 }
  environment:
    STEAMOS_RESOLUTION: ${STEAMOS_RESOLUTION:-1920x1080}
    STEAMOS_REFRESH: ${STEAMOS_REFRESH:-60}
    SUNSHINE_USER: ${SUNSHINE_USER:-admin}
    SUNSHINE_PASS: ${SUNSHINE_PASS:-}
    TZ: ${TZ:-UTC}

# Each service lists its volumes in full (YAML merge replaces lists).
# /dev/input + /run/udev: Sunshine's virtual controllers/keyboard/mouse are
# created on the host kernel, so the container needs the host's input nodes
# and udev database to see them.

services:
  steamos-amd:
    <<: *steamos
    profiles: [amd]
    container_name: steamos-amd
    hostname: steamos-amd
    image: ${IMAGE_REPO:-steamos-docker}:amd
    build:
      context: .
      target: amd
      args:
        STEAMOS_VERSION: ${STEAMOS_VERSION:-latest}
        SUNSHINE_VERSION: ${SUNSHINE_VERSION:-latest}
    volumes:
      - /dev/input:/dev/input
      - /run/udev:/run/udev:ro
      - /run/avahi-daemon:/run/avahi-daemon
      - steamos-amd-home:/home/deck

  steamos-nvidia:
    <<: *steamos
    profiles: [nvidia]
    container_name: steamos-nvidia
    hostname: steamos-nvidia
    image: ${IMAGE_REPO:-steamos-docker}:nvidia
    build:
      context: .
      target: nvidia
      args:
        STEAMOS_VERSION: ${STEAMOS_VERSION:-latest}
        SUNSHINE_VERSION: ${SUNSHINE_VERSION:-latest}
    volumes:
      - /dev/input:/dev/input
      - /run/udev:/run/udev:ro
      - /run/avahi-daemon:/run/avahi-daemon
      - steamos-nvidia-home:/home/deck
      - nvidia-cache:/var/cache/nvidia

volumes:
  steamos-amd-home:
  steamos-nvidia-home:
  nvidia-cache:
