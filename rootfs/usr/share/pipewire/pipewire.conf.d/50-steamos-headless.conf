# The container has no sound card. Sunshine's own virtual sinks only exist
# while a Moonlight client is connected, so until then PipeWire's only
# output is its Dummy Output. This sink always exists and is the default;
# Steam's audio follows the default to Sunshine's sink when a client
# connects.
#
# No X11 bell: PipeWire starts before any X server, so the module fails to
# set up at every start, and its cleanup can deadlock PipeWire's startup
# (pw_thread_loop_stop in module init, seen with 1.6.8). Gamescope then
# waits for PipeWire forever and Gaming Mode never starts.
context.properties = {
	module.x11.bell = false
}
context.objects = [
	{ factory = adapter
		args = {
			factory.name     = support.null-audio-sink
			node.name        = "steamos-headless"
			node.description = "Stream (Moonlight)"
			media.class      = Audio/Sink
			audio.position   = [ FL FR ]
			priority.session = 2000
			priority.driver  = 2000
		}
	}
]
