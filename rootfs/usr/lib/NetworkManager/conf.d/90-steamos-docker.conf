# NetworkManager only reports the network here; Docker/the host configure it.
# Steam in SteamOS mode reads the connection from NetworkManager, and without
# one its setup screen says "no networks found" and won't continue.
[main]
plugins=keyfile
no-auto-default=*
dns=none
rc-manager=unmanaged

# Same check a Steam Deck uses; "full" connectivity is what Steam wants.
[connectivity]
uri=http://test.steampowered.com/
response=success
interval=300

[logging]
level=WARN
