# Minimal sway: just a borderless headless output for gamescope to fill.
output HEADLESS-1 mode --custom 1920x1080@60Hz
# gamescope runs its own Xwayland; sway's would also collide with a host X
# server's abstract socket under host networking.
xwayland disable
# No wallpaper helper (swaybg isn't installed or needed).
swaybg_command -
default_border none
default_floating_border none
focus_follows_mouse no
seat * hide_cursor 3000
for_window [app_id="gamescope"] fullscreen enable
for_window [class="gamescope"] fullscreen enable
