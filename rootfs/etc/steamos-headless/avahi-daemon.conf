# SteamOS ships Avahi with publishing disabled. Sunshine needs it so Moonlight
# can discover the host, so this config is used instead (avahi-daemon -f).
# The entrypoint adds allow-interfaces and sets publish-addresses=no when the
# host already runs an mDNS responder (see entrypoint).
[server]
use-ipv4=yes
use-ipv6=yes
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[publish]
disable-publishing=no
disable-user-service-publishing=no
publish-addresses=yes
publish-hinfo=no
publish-workstation=no
publish-domain=no

[reflector]
enable-reflector=no
