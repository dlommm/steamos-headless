# SteamOS package repositories (Valve). @VERSION@ is replaced at build time
# with STEAMOS_VERSION, e.g. 3.8 (stable) or 3.9 (preview).
# Valve's jupiter/holo repos are listed first so their builds (gamescope,
# mesa, steam) win over the Arch snapshot in core/extra/multilib.

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
NoExtract   = usr/share/help/* usr/share/doc/* usr/share/man/* usr/share/info/* usr/share/gtk-doc/*

[jupiter-@VERSION@]
Include = /etc/pacman.d/steamos-mirrorlist

[holo-@VERSION@]
Include = /etc/pacman.d/steamos-mirrorlist

[core-@VERSION@]
Include = /etc/pacman.d/steamos-mirrorlist

[extra-@VERSION@]
Include = /etc/pacman.d/steamos-mirrorlist

[multilib-@VERSION@]
Include = /etc/pacman.d/steamos-mirrorlist
