# Builds the single SteamOS image (AMD + NVIDIA) and pushes it to Docker Hub.
#   main:           dendlomm/steamos-headless:latest
#                   dendlomm/steamos-headless:<version>       e.g. 2026.09.28.3 (date.run)
#                   dendlomm/steamos-headless:steamos-<x.y>   newest build for that SteamOS release
#                   plus a GitHub Release <version> listing the SteamOS/Sunshine/Steam/
#                   gamescope/Mesa versions inside the image
#   other branches: dendlomm/steamos-headless:branch-<name> only, for testing
#
# Runs weekly to pick up new SteamOS and Sunshine releases, and from the
# Actions tab (Run workflow). Builds never use the layer cache, so "latest"
# is re-resolved every run.
name: build

on:
  push:
    branches: ["**"]
    paths: [Dockerfile, "rootfs/**", .github/workflows/build.yml]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  IMAGE: docker.io/dendlomm/steamos-headless
  STEAMOS_VERSION: latest
  SUNSHINE_VERSION: latest

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # The image is several GB; the runner's toolchains aren't needed.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build
        run: |
          VERSION="$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          docker build --pull --no-cache \
            --build-arg STEAMOS_VERSION="$STEAMOS_VERSION" \
            --build-arg SUNSHINE_VERSION="$SUNSHINE_VERSION" \
            --build-arg IMAGE_VERSION="$VERSION" \
            -t "$IMAGE:$VERSION" .
          docker run --rm --entrypoint cat "$IMAGE:$VERSION" /etc/steamos-headless-release | tee release.txt
          # Component versions -> REL_* for the tags and release notes.
          sed -E 's/^([A-Z_]+)=/REL_\1=/' release.txt \
            | grep -vE '^REL_(SUNSHINE_URL|IMAGE_VERSION)=' >> "$GITHUB_ENV"

      - name: Push
        run: |
          if [[ "$GITHUB_REF_NAME" == "${{ github.event.repository.default_branch }}" ]]; then
            tags=("$VERSION" latest "steamos-$REL_STEAMOS_VERSION")
          else
            # Test builds: only a branch-<name> tag, never latest or a release.
            tags=("branch-$(echo "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._\n-' '-')")
          fi
          for tag in "${tags[@]}"; do
            docker tag "$IMAGE:$VERSION" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done

      - name: Release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<EOF
          \`\`\`
          docker pull dendlomm/steamos-headless:$VERSION
          \`\`\`

          One image for AMD and NVIDIA GPUs. The GPU is detected at start.

          | Component | Version |
          |---|---|
          | SteamOS package repos | $REL_STEAMOS_VERSION |
          | Steam client (steam-jupiter-stable) | $REL_STEAM_JUPITER_STABLE |
          | gamescope | $REL_GAMESCOPE |
          | Mesa (Valve build) | $REL_MESA |
          | RADV (vulkan-radeon) | $REL_VULKAN_RADEON |
          | Sunshine | $REL_SUNSHINE_VERSION |

          Also tagged \`latest\` and \`steamos-$REL_STEAMOS_VERSION\`. Built from ${GITHUB_SHA::8} by
          [run $GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).
          EOF
          gh release create "$VERSION" --target "$GITHUB_SHA" \
            --title "$VERSION: SteamOS $REL_STEAMOS_VERSION, Sunshine $REL_SUNSHINE_VERSION" \
            --notes-file release-notes.md release.txt

      # Docker Hub's overview page shows the README.
      - name: Docker Hub description
        if: github.ref_name == github.event.repository.default_branch
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: dendlomm/steamos-headless
          short-description: A full SteamOS clone, headless, in Docker. Stream it with Moonlight. AMD and NVIDIA.
          enable-url-completion: true
