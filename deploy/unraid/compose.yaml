# Unraid, Compose Manager plugin: Docker > Add New Stack > paste this.
# (Or use the steamos-headless.xml template instead.) See docs/install/unraid.md

services:
  steamos:
    image: dendlomm/steamos-headless:latest
    container_name: steamos
    restart: unless-stopped
    network_mode: host
    privileged: true
    ipc: host
    ulimits:
      nofile: { soft: 524288, hard: 524288 }
      memlock: { soft: -1, hard: -1 }
    environment:
      GPU_VENDOR: auto              # auto | nvidia | amd (only for hosts with both)
      # GPU: "0000:c1:00.0"         # multi-GPU hosts: use only this card (PCI address from the log's "GPUs found" table)
      # SSH_AUTHORIZED_KEYS: "ssh-ed25519 AAAA..."   # optional: SSH in as deck on port 2222 for debugging
      STEAMOS_RESOLUTION: 1920x1080 # first start only; then the last Moonlight client's size
      STEAMOS_REFRESH: 60
      SUNSHINE_USER: admin
      SUNSHINE_PASS: ""             # set to preconfigure the web UI login
      TZ: UTC
      # Optional Deck add-ons; every option is in docs/add-ons.md:
      # PRELOAD_APPS: decky,heroic,protonup,xcloud
      # PRELOAD_FLATPAKS: com.spotify.Client
      # DECKY_PLUGINS: CSS Loader,SteamGridDB
      # ADD_TO_STEAM: default                    # none, or names/app IDs to add to Steam
    volumes:
      - /dev/input:/dev/input
      - /run/udev:/run/udev:ro
      - /mnt/cache/appdata/steamos:/home/deck   # Steam + config on the cache pool
      # Optional: game library on the array, added to Steam automatically.
      # - /mnt/user/games:/games
      - /mnt/cache/appdata/steamos-nvidia-cache:/var/cache/nvidia
