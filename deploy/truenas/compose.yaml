# TrueNAS SCALE 24.10+ (Electric Eel and later): Apps > Discover Apps >
# ⋮ > Install via YAML. Paste this, replacing "tank" with your pool.
# Create the datasets first (Datasets > Add Dataset):
#   tank/apps/steamos/home          Steam library + config
#   tank/apps/steamos/nvidia-cache  NVIDIA driver cache
#   (optional) a games dataset on an HDD pool, mounted at /games
# Full steps: docs/install/truenas.md

services:
  steamos:
    image: dendlomm/steamos-headless:latest
    container_name: steamos
    restart: unless-stopped
    network_mode: host
    privileged: true
    ipc: host
    ulimits:
      nofile: { soft: 524288, hard: 524288 }
      memlock: { soft: -1, hard: -1 }
    environment:
      GPU_VENDOR: auto
      # GPU: "0000:c1:00.0"         # multi-GPU hosts: use only this card (PCI address from the log's "GPUs found" table)
      STEAMOS_RESOLUTION: 1920x1080
      STEAMOS_REFRESH: 60
      SUNSHINE_USER: admin
      SUNSHINE_PASS: ""
      TZ: UTC
      # Optional Deck add-ons; every option is in docs/add-ons.md:
      # PRELOAD_APPS: decky,heroic,protonup,xcloud
      # PRELOAD_FLATPAKS: com.spotify.Client
      # DECKY_PLUGINS: CSS Loader,SteamGridDB
      # ADD_TO_STEAM: default                    # none, or names/app IDs to add to Steam
    volumes:
      - /dev/input:/dev/input
      - /run/udev:/run/udev:ro
      - /mnt/tank/apps/steamos/home:/home/deck
      # Optional: game library on an HDD pool, added to Steam automatically.
      # - /mnt/hddpool/games:/games
      - /mnt/tank/apps/steamos/nvidia-cache:/var/cache/nvidia
